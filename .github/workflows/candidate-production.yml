name: Candidate Shorts production (real footage, no upload)

# Processes EVERY entry in config/candidate-manifest.json independently:
# validate -> retrieve -> probe -> rights/footage gates -> transcribe ->
# select -> render -> QC/repair -> checksum, with a structured outcome
# recorded for every candidate. This workflow NEVER uploads to YouTube.

on:
  push:
    branches: [editorial-evidence-hold]
    paths:
      - ".github/workflows/candidate-production.yml"
      - "config/candidate-manifest.json"
      - "scripts/produce-candidates.mjs"
      - "scripts/compare-candidates.mjs"
      - "src/clips/**"
      - "src/production/render.js"
      - "src/production/qc-repair.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-production
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg, transcription dependencies and run tests for changed modules
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          python -m pip install --disable-pip-version-check -r requirements/repurposing.txt
      - name: Produce every manifest candidate independently
        env:
          PYTHON: python
        run: node scripts/produce-candidates.mjs config/candidate-manifest.json output/candidates work/candidates-cloud
      - name: Compare and rank only real results from this run
        run: node scripts/compare-candidates.mjs config/candidate-manifest.json output/candidates output/candidates
      - name: Checksum generated media artifacts
        if: always()
        run: |
          cd output/candidates
          find . -type f \( -name "*.mp4" -o -name "*.jpg" \) -print0 | sort -z | xargs -0 -r sha256sum | tee SHA256SUMS.txt
          ls -la
      - name: Candidate outcome summary
        if: always()
        run: |
          cat output/candidates/comparison.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-shorts
          path: output/candidates/
          retention-days: 30

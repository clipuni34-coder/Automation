name: Daily multi-channel operations

# Autonomous daily cycle for every configured channel: per-niche research,
# rights screening, dedupe against persistent state, per-channel production
# queues, retries, and run records. Publishing is NOT performed here except
# through the separate, guarded publishing workflows.
#
# Persistent state: the `automation-state` branch (state/ directory) is
# checked out, updated, and pushed back by this workflow. Runner files are
# never the database.
#
# SCHEDULING NOTE (platform rule): GitHub `schedule` events only fire from
# the DEFAULT branch. This workflow declares the cron schedule; it becomes
# active if/when this file reaches the default branch. Until then it can be
# triggered by workflow_dispatch or an external scheduler calling the
# workflow dispatch API. It is never triggered manually day-to-day by design
# of the run itself.

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [editorial-evidence-hold]
    paths:
      - ".github/workflows/daily-operations.yml"
      - "src/engine/**"
      - "config/channels.json"
      - "config/niches.json"
  workflow_dispatch:
    inputs:
      production_enabled:
        description: "Produce eligible candidates (rendering) during this run"
        type: boolean
        default: false
      approve_private_upload:
        description: "Deprecated gate kept for scheduler compatibility; uploading ALSO requires the per-video approval below"
        type: boolean
        default: false
      approve_candidate_id:
        description: "Per-video approval: candidate id of the ONE video approved for private upload"
        type: string
        default: ""
      approve_sha256:
        description: "Per-video approval: exact SHA-256 of that video's rendered output"
        type: string
        default: ""
      approve_audience:
        description: "Audience reviewed for that exact video (required for private upload)"
        type: choice
        options:
          - review_required
          - made_for_kids
          - not_made_for_kids
        default: review_required

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-operations
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editorial-evidence-hold
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/repurposing.txt
      - name: Restore persistent channel state (automation-state branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "automation-bot"
          git config user.email "PrimePlug"
          if git ls-remote --exit-code --heads origin automation-state >/dev/null 2>&1; then
            git fetch origin automation-state
            git worktree add state automation-state
          else
            git worktree add --orphan -b automation-state state
            cd state && git commit --allow-empty -m "init: automation state" && git push origin automation-state && cd ..
          fi
          ls state/ || true
      - name: Install FFmpeg and transcription dependencies
        # Bounded so a stalled download fails the step fast and the run can
        # be retried, instead of hanging until the job timeout. FFmpeg comes
        # from a static GitHub-hosted build: the Ubuntu apt mirror proved
        # unreliable (run 42053319028 spent 20 min downloading 69 MB of
        # ffmpeg packages and timed out before pip even started).
        timeout-minutes: 20
        run: |
          if ! command -v ffmpeg >/dev/null; then
            mkdir -p "$HOME/ffbin"
            if curl -fsSL --retry 3 --connect-timeout 20 -o /tmp/ffmpeg.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" && tar -xJf /tmp/ffmpeg.tar.xz -C /tmp; then
              cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe "$HOME/ffbin/"
            elif curl -fsSL --retry 3 --connect-timeout 20 -o /tmp/ffmpeg.tar.xz "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz" && tar -xJf /tmp/ffmpeg.tar.xz -C /tmp; then
              FFDIR=$(find /tmp -maxdepth 1 -type d -name 'ffmpeg-*-amd64-static' | head -1)
              cp "$FFDIR/ffmpeg" "$FFDIR/ffprobe" "$HOME/ffbin/"
            else
              sudo apt-get update -qq && sudo apt-get install -y ffmpeg
            fi
            echo "$HOME/ffbin" >> "$GITHUB_PATH"
            export PATH="$HOME/ffbin:$PATH"
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1
          python -m pip install --disable-pip-version-check --prefer-binary --timeout 60 --retries 3 -r requirements/repurposing.txt
      - name: Run daily operations for all channels
        env:
          PYTHON: python
          STATE_DIR: state
          CHANNEL_PROFILES_PATH: config/channels.json
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          RSS_FEEDS: ${{ vars.RSS_FEEDS }}
          DAILY_PRODUCTION_ENABLED: ${{ inputs.production_enabled || 'false' }}
          ENABLE_GEMINI_TTS: "true"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run daily-operations
      - name: Approval-gated PRIVATE upload of produced Primeplug videos (never public)
        if: inputs.approve_private_upload == true && inputs.approve_candidate_id != '' && inputs.approve_sha256 != ''
        env:
          STATE_DIR: state
          HUMAN_APPROVED_PRIVATE: "true"
          APPROVED_CANDIDATE_ID: ${{ inputs.approve_candidate_id }}
          APPROVED_SHA256: ${{ inputs.approve_sha256 }}
          APPROVED_AUDIENCE: ${{ inputs.approve_audience }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN || secrets.REFRESH_TOKEN }}
          YOUTUBE_EXPECTED_CHANNEL_ID: ${{ vars.YOUTUBE_EXPECTED_CHANNEL_ID }}
          PUBLISH_REPORT: output/publishing/publish-report.json
        run: npm run publish-awaiting
      - name: Duplicate-upload prevention proof (second pass must record zero new uploads)
        if: inputs.approve_private_upload == true && inputs.approve_candidate_id != '' && inputs.approve_sha256 != ''
        env:
          STATE_DIR: state
          HUMAN_APPROVED_PRIVATE: "true"
          APPROVED_CANDIDATE_ID: ${{ inputs.approve_candidate_id }}
          APPROVED_SHA256: ${{ inputs.approve_sha256 }}
          APPROVED_AUDIENCE: ${{ inputs.approve_audience }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN || secrets.REFRESH_TOKEN }}
          YOUTUBE_EXPECTED_CHANNEL_ID: ${{ vars.YOUTUBE_EXPECTED_CHANNEL_ID }}
          PUBLISH_REPORT: output/publishing/publish-report-second-pass.json
        run: npm run publish-awaiting
      - name: Sync YouTube analytics per connected channel (identity-verified)
        if: vars.SYNC_YOUTUBE_ANALYTICS == 'true'
        env:
          STATE_DIR: state
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN || secrets.REFRESH_TOKEN }}
          YOUTUBE_EXPECTED_CHANNEL_ID: ${{ vars.YOUTUBE_EXPECTED_CHANNEL_ID }}
        run: npm run sync-analytics
      - name: Independently verify published registry against the YouTube API
        if: always()
        continue-on-error: true
        env:
          STATE_DIR: state
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN || secrets.REFRESH_TOKEN }}
          YOUTUBE_EXPECTED_CHANNEL_ID: ${{ vars.YOUTUBE_EXPECTED_CHANNEL_ID }}
        run: node scripts/verify-published.mjs
      - name: Persist updated channel state
        run: |
          printf '*.mp4\n*.webm\n*.wav\n*.source\n**/production/work/\n' > state/.gitignore
          cd state
          git add -A
          if git diff --cached --quiet; then echo "No state changes"; else
            git commit -m "state: daily operations $(date -u +%F)"
            # Retry with rebase: another run may have advanced the state
            # branch since checkout (observed in run 42062278022, where a
            # single push attempt failed with a commit_refs error and the
            # cycle's state was nearly lost).
            for attempt in 1 2 3; do
              if git push origin automation-state; then break; fi
              if [ "$attempt" = "3" ]; then echo "state push failed after 3 attempts"; exit 1; fi
              git fetch origin automation-state
              git rebase -X theirs origin/automation-state
            done
          fi
      - name: Daily summary
        if: always()
        run: |
          for f in output/daily/*/summary.json; do echo "### $f"; cat "$f" | head -100; done >> "$GITHUB_STEP_SUMMARY" || true
      - name: Refresh mobile dashboard with the new persisted state
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-mobile.yml --ref editorial-evidence-hold || echo "dashboard refresh dispatch failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-operations-report
          path: |
            output/daily/
            output/publishing/
            state/Primeplug/production/output/
          if-no-files-found: warn
          retention-days: 30

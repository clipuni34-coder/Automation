name: Discovery scan

on:
  workflow_dispatch:
    inputs:
      produce_videos:
        description: "Generate a vertical MP4."
        required: false
        type: boolean
        default: false
      render_preapproved_brief:
        description: "Render the exact McLintock brief approved by the channel owner."
        required: false
        type: boolean
        default: false
      publish_videos:
        description: "Explicitly allow YouTube uploads. Leave off for a test render."
        required: false
        type: boolean
        default: false
      repurpose_source_url:
        description: "Direct public HTTPS video-file link for footage you own or are authorized to reuse."
        required: false
        type: string
      repurpose_rights_status:
        description: "Rights declaration for the source footage. Do not select a status you cannot substantiate."
        required: false
        type: choice
        options:
          - not_authorized
          - owned_by_user
          - permission_granted
          - licensed
          - public_domain
        default: not_authorized
      repurpose_rights_evidence_url:
        description: "HTTPS link to permission, license, or public-domain evidence (required except for footage you own)."
        required: false
        type: string
      repurpose_platform:
        description: "Platform the source rights permit."
        required: false
        type: choice
        options:
          - youtube_shorts
          - instagram_reels
          - tiktok
        default: youtube_shorts
      repurpose_target_seconds:
        description: "Target duration for the finished short."
        required: false
        type: choice
        options:
          - "30"
          - "45"
          - "60"
          - "90"
        default: "45"
      repurpose_title:
        description: "Optional source-video title."
        required: false
        type: string
      repurpose_creator:
        description: "Optional original creator name."
        required: false
        type: string
  schedule:
    - cron: '0 9 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: discovery-scan
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Restore previous discovery observations
        uses: actions/cache@v4
        with:
          path: |
            data/discovery.json
            data/strategy.json
            data/niche-research.json
            data/content-history.json
            data/youtube-analytics.json
          key: discovery-history-${{ github.run_id }}
          restore-keys: |
            discovery-history-
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensure FFmpeg is available for video rendering
        if: vars.ENABLE_ORIGINAL_AI_CONTENT == 'true' && (vars.PRODUCE_VIDEOS == 'true' || inputs.produce_videos == true)
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "Runner FFmpeg is already installed; skipping package installation."
          else
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Cache Kokoro model files
        if: vars.ENABLE_ORIGINAL_AI_CONTENT == 'true' && (vars.PRODUCE_VIDEOS == 'true' || inputs.produce_videos == true)
        uses: actions/cache@v4
        with:
          path: models/kokoro
          key: kokoro-onnx-v1.0-${{ runner.os }}
      - name: Set up Python 3.12 for Kokoro TTS
        if: vars.ENABLE_ORIGINAL_AI_CONTENT == 'true' && (vars.PRODUCE_VIDEOS == 'true' || inputs.produce_videos == true)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download Kokoro model and verify checksums
        if: vars.ENABLE_ORIGINAL_AI_CONTENT == 'true' && (vars.PRODUCE_VIDEOS == 'true' || inputs.produce_videos == true)
        run: |
          python -m pip install --disable-pip-version-check kokoro-onnx==0.6.1 soundfile
          mkdir -p models/kokoro
          if [ ! -s models/kokoro/kokoro-v1.0.onnx ]; then
            curl --fail --location --retry 3 --output models/kokoro/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          fi
          if [ ! -s models/kokoro/voices-v1.0.bin ]; then
            curl --fail --location --retry 3 --output models/kokoro/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          fi
          echo "beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a  models/kokoro/kokoro-v1.0.onnx" | sha256sum --check
          echo "bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  models/kokoro/voices-v1.0.bin" | sha256sum --check
          printf '%s' '{"text":"This is a local narration test for the autonomous video production workflow. It checks the voice model before any video is rendered.","outputPath":"/tmp/kokoro-smoke.wav","modelPath":"models/kokoro/kokoro-v1.0.onnx","voicesPath":"models/kokoro/voices-v1.0.bin","voice":"af_heart"}' | python scripts/kokoro_tts.py
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 /tmp/kokoro-smoke.wav
      - name: Run global discovery
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          DISCOVERY_REGIONS: ${{ vars.DISCOVERY_REGIONS || 'US,GB,CA,AU,IN,NG,ZA,BR,MX,DE,JP,KR' }}
          DISCOVERY_CATEGORIES: ${{ vars.DISCOVERY_CATEGORIES || '1,2,10,15,17,19,20,22,23,24,25,26,27,28,29' }}
          DISCOVERY_SEARCH_QUERIES: ${{ vars.DISCOVERY_SEARCH_QUERIES || 'viral funny moments|unexpected reaction moments|gaming streamer moments|viral sports moments|surprising real-life moments' }}
          DISCOVERY_SEARCH_MAX_RESULTS: '20'
          DISCOVERY_SEARCH_ORDER: 'viewCount'
          DISCOVERY_SEARCH_REGION: 'US'
          DISCOVERY_CONCURRENCY: '5'
          RSS_FEEDS: ${{ vars.RSS_FEEDS || 'https://trends.google.com/trending/rss?geo=NG,https://trends.google.com/trending/rss?geo=US,https://trends.google.com/trending/rss?geo=GB,https://trends.google.com/trending/rss?geo=IN,https://trends.google.com/trending/rss?geo=ZA,https://trends.google.com/trending/rss?geo=CA,https://trends.google.com/trending/rss?geo=AU' }}
          DISCOVERY_STORE_PATH: data/discovery.json
        run: |
          if [ -z "$YOUTUBE_DATA_API_KEY" ]; then
            echo "::error::YOUTUBE_DATA_API_KEY is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          npm run discover
      - name: Build autonomous daily editorial plan
        env:
          DISCOVERY_STORE_PATH: data/discovery.json
          STRATEGY_STORE_PATH: data/strategy.json
        run: npm run daily-plan
      - name: Build mobile-friendly viral discovery report
        env:
          DISCOVERY_STORE_PATH: data/discovery.json
          STRATEGY_STORE_PATH: data/strategy.json
          VIRAL_REPORT_PATH: data/viral-discovery-report.html
        run: npm run viral-report

      - name: Research best YouTube channel niches
        env:
          DISCOVERY_STORE_PATH: data/discovery.json
          NICHE_RESEARCH_PATH: data/niche-research.json
        run: npm run research-niches

      - name: Sync authorized YouTube channel analytics
        if: vars.SYNC_YOUTUBE_ANALYTICS == 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_ANALYTICS_PATH: data/youtube-analytics.json
        run: npm run youtube-analytics

      - name: Sync authorized YouTube comment inbox
        if: vars.SYNC_YOUTUBE_COMMENTS == 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_EXPECTED_CHANNEL_ID: ${{ vars.YOUTUBE_EXPECTED_CHANNEL_ID }}
          YOUTUBE_COMMENTS_PATH: data/youtube-comment-inbox.json
          YOUTUBE_COMMENTS_MAX_RESULTS: '50'
        run: npm run youtube-comments

      - name: Research the three strongest qualified candidates
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          DISCOVERY_STORE_PATH: data/discovery.json
        run: |
          if [ -z "$TAVILY_API_KEY" ]; then
            echo "::warning::TAVILY_API_KEY is missing; creating clearly-labelled discovery-only dossiers."
            npm run create-dossiers
            exit 0
          fi

          if [ ! -s "$DISCOVERY_STORE_PATH" ]; then
            echo "::warning::Discovery store is missing; skipping research."
            exit 0
          fi

          count=0
          while IFS= read -r topic; do
            [ -z "$topic" ] && continue
            echo "Researching qualified candidate $((count + 1)) of up to 3"
            if npm run research -- "$topic"; then
              count=$((count + 1))
            else
              echo "::warning::Research failed for one candidate; continuing with the remaining candidates."
            fi
          done < <(jq -r '[.candidates[] | select(.decision == "needs_research" and (.score // 0) >= 35) | .title] | unique | .[:3][]' "$DISCOVERY_STORE_PATH")

          if [ "$count" -eq 0 ]; then
            echo "::warning::Independent research produced no dossiers; creating clearly-labelled discovery-only dossiers as a fallback."
            npm run create-dossiers
          fi
          echo "Research dossiers created: $count"
      - name: Select strongest daily research dossier
        id: select_dossier
        env:
          DISCOVERY_STORE_PATH: data/discovery.json
        run: |
          best_dossier=$(npm run --silent select-best-dossier)
          echo "path=$best_dossier" >> "$GITHUB_OUTPUT"
          if [ -n "$best_dossier" ]; then echo "Selected dossier: $best_dossier"; else echo "No eligible research dossier found."; fi

      - name: Generate original creative briefs
        if: vars.ENABLE_ORIGINAL_AI_CONTENT == 'true'
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: 'openrouter/free'
          ENABLE_GEMINI_CREATIVE: ${{ vars.ENABLE_GEMINI_CREATIVE || 'false' }}
          ENABLE_OPENAI_CREATIVE: ${{ vars.ENABLE_OPENAI_CREATIVE || 'false' }}
          ENABLE_GEMINI_EVIDENCE_ASSESSMENT: ${{ vars.ENABLE_GEMINI_EVIDENCE_ASSESSMENT || 'false' }}
          SELECTED_DOSSIER: ${{ steps.select_dossier.outputs.path }}
          CREATIVE_LANGUAGE: ${{ vars.CREATIVE_LANGUAGE || 'English' }}
        run: |
          if { [ "$ENABLE_GEMINI_CREATIVE" != "true" ] || [ -z "$GEMINI_API_KEY" ]; } && { [ "$ENABLE_OPENAI_CREATIVE" != "true" ] || [ -z "$OPENAI_API_KEY" ]; } && [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::warning::No creative model key configured; research dossiers are saved without creative briefs."
            exit 0
          fi

          if [ -z "$SELECTED_DOSSIER" ] || [ ! -s "$SELECTED_DOSSIER" ]; then
            echo "No research dossiers available for creative reasoning."
            exit 0
          fi

          if npm run create-brief -- "$SELECTED_DOSSIER"; then
            echo "Creative brief generated from $SELECTED_DOSSIER"
          else
            echo "::warning::Creative generation failed for $SELECTED_DOSSIER; preserving the research dossier."
          fi
      - name: Restore and record the exact approved McLintock brief
        if: vars.ENABLE_ORIGINAL_AI_CONTENT == 'true' && inputs.render_preapproved_brief == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p approved-artifact
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/13153578471/zip" \
            --output /tmp/approved-creative-brief.zip
          unzip -q /tmp/approved-creative-brief.zip -d approved-artifact
          brief=$(find approved-artifact -maxdepth 2 -type f -name '*.creative.json' -print -quit)
          if [ -z "$brief" ]; then
            echo "::error::The approved creative brief artifact could not be found."
            exit 1
          fi
          node scripts/approve-mclintock-brief.mjs "$brief" research-approved-mclintock.creative.json

      - name: Render original videos when explicitly enabled
        if: vars.ENABLE_ORIGINAL_AI_CONTENT == 'true' && (vars.PRODUCE_VIDEOS == 'true' || inputs.produce_videos == true)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_VISION_MODEL: 'openrouter/free'
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ENABLE_GEMINI_TTS: ${{ vars.ENABLE_GEMINI_TTS || 'false' }}
          ENABLE_GEMINI_IMAGE_GENERATION: ${{ vars.ENABLE_GEMINI_IMAGE_GENERATION || 'false' }}
          ENABLE_OPENAI_VISION_QC: ${{ vars.ENABLE_OPENAI_VISION_QC || 'false' }}
          ENABLE_GEMINI_VISION_QC: ${{ vars.ENABLE_GEMINI_VISION_QC || 'false' }}
          YOUTUBE_AUTO_PUBLISH: ${{ vars.YOUTUBE_AUTO_PUBLISH || 'false' }}
          YOUTUBE_EXPECTED_CHANNEL_ID: ${{ vars.YOUTUBE_EXPECTED_CHANNEL_ID }}
          CONTENT_HISTORY_PATH: data/content-history.json
        run: |
          if [ ! -s models/kokoro/kokoro-v1.0.onnx ] || [ ! -s models/kokoro/voices-v1.0.bin ]; then
            echo "::error::Kokoro fallback model is missing; narration cannot be generated without a working TTS provider."
            exit 1
          fi

          shopt -s nullglob
          if [ "${{ inputs.render_preapproved_brief }}" = "true" ]; then
            briefs=(research-approved-mclintock.creative.json)
          else
            briefs=(research-*.creative.json)
          fi
          if [ ${#briefs[@]} -eq 0 ]; then
            echo "No creative briefs available for production."
            exit 0
          fi

          rendered=0
          failed=0
          for brief in "${briefs[@]}"; do
            output_dir="output/${brief%.json}"
            if npm run produce -- "$brief" "$output_dir"; then
              rendered=$((rendered + 1))
            else
              failed=$((failed + 1))
              echo "::warning::Video production failed for $brief; continuing."
            fi
          done
          echo "Videos rendered: $rendered; failed: $failed"
          if [ "$failed" -gt 0 ]; then
            echo "::error::One or more video production jobs failed. Review the rendered-videos artifact and logs."
            exit 1
          fi

      - name: Publish only fully approved videos to YouTube
        if: vars.ENABLE_ORIGINAL_AI_CONTENT == 'true' && inputs.publish_videos == true && vars.YOUTUBE_AUTO_PUBLISH == 'true' && (vars.PRODUCE_VIDEOS == 'true' || inputs.produce_videos == true)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_EXPECTED_CHANNEL_ID: ${{ vars.YOUTUBE_EXPECTED_CHANNEL_ID }}
          YOUTUBE_AUTO_PUBLISH: ${{ vars.YOUTUBE_AUTO_PUBLISH || 'false' }}
          YOUTUBE_ALLOW_PUBLIC_PUBLISH: ${{ vars.YOUTUBE_ALLOW_PUBLIC_PUBLISH || 'false' }}
          YOUTUBE_PUBLISH_PRIVACY: ${{ vars.YOUTUBE_PUBLISH_PRIVACY || 'private' }}
          CONTENT_HISTORY_PATH: data/content-history.json
        run: |
          if [ -z "$YOUTUBE_REFRESH_TOKEN" ] || [ -z "$YOUTUBE_EXPECTED_CHANNEL_ID" ]; then
            echo "::warning::YouTube OAuth refresh token or expected channel ID is missing; no uploads will be attempted."
            exit 0
          fi
          shopt -s globstar nullglob
          packages=(output/**/publishing-package.json)
          uploaded=0
          held=0
          failed=0
          for package in "${packages[@]}"; do
            if jq -e '.publication.status == "approved_for_upload" and .publication.manualApprovalRequired == false and .quality.visualQualityStatus == "passed" and .monetizationPreflight.status == "preflight_passed" and (.monetizationPreflight.blockers | length) == 0 and .contentDistinctness.distinct == true' "$package" >/dev/null; then
              if npm run youtube-upload -- "$package"; then
                uploaded=$((uploaded + 1))
              else
                failed=$((failed + 1))
                echo "::error::Upload failed for $package"
              fi
            else
              held=$((held + 1))
              echo "Holding $package: one or more originality, rights, factual, or visual gates did not pass."
            fi
          done
          echo "YouTube uploads completed: $uploaded; held for quality/policy gates: $held; failed: $failed"
          if [ "$failed" -gt 0 ]; then exit 1; fi

      - name: Report workflow readiness
        if: always()
        env:
          ENABLE_GEMINI_CREATIVE: ${{ vars.ENABLE_GEMINI_CREATIVE || 'false' }}
          ENABLE_OPENAI_CREATIVE: ${{ vars.ENABLE_OPENAI_CREATIVE || 'false' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PRODUCE_VIDEOS: ${{ vars.PRODUCE_VIDEOS || 'false' }}
          YOUTUBE_AUTO_PUBLISH: ${{ vars.YOUTUBE_AUTO_PUBLISH || 'false' }}
          INPUT_PRODUCE_VIDEOS: ${{ inputs.produce_videos || false }}
          INPUT_RENDER_APPROVED_BRIEF: ${{ inputs.render_preapproved_brief || false }}
          SYNC_YOUTUBE_ANALYTICS: ${{ vars.SYNC_YOUTUBE_ANALYTICS || 'false' }}
          SYNC_YOUTUBE_COMMENTS: ${{ vars.SYNC_YOUTUBE_COMMENTS || 'false' }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_EXPECTED_CHANNEL_ID: ${{ vars.YOUTUBE_EXPECTED_CHANNEL_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, mkdirSync, writeFileSync, appendFileSync } from 'node:fs';
          const files = name => existsSync(name);
          const creativeEnabled =
            (process.env.ENABLE_GEMINI_CREATIVE === 'true' && Boolean(process.env.GEMINI_API_KEY)) ||
            (process.env.ENABLE_OPENAI_CREATIVE === 'true' && Boolean(process.env.OPENAI_API_KEY)) ||
            Boolean(process.env.OPENROUTER_API_KEY);
          const { readdirSync } = await import('node:fs');
          const briefNames = process.env.INPUT_RENDER_APPROVED_BRIEF === 'true'
            ? ['research-approved-mclintock.creative.json'].filter(name => existsSync(name))
            : readdirSync('.').filter(name => /^research-.*\.creative\.json$/i.test(name));
          const hasBrief = briefNames.length > 0;
          const briefGates = briefNames.map(name => {
            try {
              const brief = JSON.parse(readFileSync(name, 'utf8'));
              return brief.editorial?.productionGate ?? { status: 'held', productionEligible: false, reasons: ['Missing production gate; manual review required.'] };
            } catch { return { status: 'held', productionEligible: false, reasons: ['Brief could not be parsed.'] }; }
          });
          const eligibleBriefs = briefGates.filter(gate => gate.productionEligible === true).length;
          const hasVideo = existsSync('output') && readdirSync('output', { withFileTypes: true }).some(entry => entry.isDirectory() && existsSync(`output/${entry.name}/short.mp4`));
          let configuredChannels = 0;
          try {
            const config = JSON.parse(readFileSync('config/channels.json', 'utf8'));
            configuredChannels = (Array.isArray(config) ? config : config.channels ?? [])
              .filter(channel => channel.id && !String(channel.id).startsWith('replace-with') && channel.status === 'active').length;
          } catch {}
          const report = {
            generatedAt: new Date().toISOString(),
            discovery: files('data/discovery.json') ? 'completed' : 'missing',
            dailyPlan: files('data/strategy.json') ? 'completed' : 'missing',
            nicheResearch: files('data/niche-research.json') ? 'completed' : 'missing',
            researchDossiers: readdirSync('.').filter(name => /^research-.*\.json$/i.test(name) && !/\.creative\.json$/i.test(name)).length,
            creativeBriefs: hasBrief ? 'generated' : creativeEnabled ? 'not_generated_check_logs' : 'blocked_missing_free_provider_key_or_paid_provider_opt_in',
            creativeProductionGate: !hasBrief ? 'not_run' : eligibleBriefs === briefGates.length ? 'passed' : 'held_for_editorial_review',
            productionEligibleBriefs: eligibleBriefs,
            videoProduction: hasVideo ? 'rendered' : process.env.PRODUCE_VIDEOS === 'true' || process.env.INPUT_PRODUCE_VIDEOS === 'true' ? 'enabled_but_no_video_rendered' : 'disabled',
            activeChannelProfiles: configuredChannels,
            youtubeAnalytics: process.env.SYNC_YOUTUBE_ANALYTICS === 'true' ? 'enabled_check_snapshot' : 'not_connected_or_disabled',
            youtubeComments: process.env.SYNC_YOUTUBE_COMMENTS === 'true' ? 'enabled_check_inbox_artifact' : 'disabled_or_not_connected',
            youtubePublishing: process.env.YOUTUBE_AUTO_PUBLISH === 'true' && process.env.YOUTUBE_REFRESH_TOKEN && process.env.YOUTUBE_EXPECTED_CHANNEL_ID
              ? 'enabled_check_upload_confirmations' : 'disabled_or_missing_channel_oauth',
            publicationSafety: 'No upload is reported unless a YouTube upload confirmation artifact exists.'
          };
          mkdirSync('data', { recursive: true });
          writeFileSync('data/workflow-readiness.json', JSON.stringify(report, null, 2) + '\n', { mode: 0o600 });
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '## Automation readiness',
            '',
            '| Component | Status |',
            '|---|---|',
            ...Object.entries(report).filter(([key]) => key !== 'generatedAt' && key !== 'publicationSafety').map(([key, value]) => `| ${key} | ${value} |`),
            '',
            report.publicationSafety
          ].join('\n') + '\n');
          console.log(JSON.stringify(report, null, 2));
          NODE

      - name: Save YouTube upload confirmations
        if: always() && hashFiles('output/**/publishing-package.youtube-upload.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: youtube-upload-confirmations
          path: output/**/publishing-package.youtube-upload.json
          retention-days: 30

      - name: Save rendered videos and production packages
        if: always() && hashFiles('output/**/short.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: rendered-videos
          path: output/
          retention-days: 14

      - name: Save creative briefs
        if: always() && hashFiles('research-*.creative.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: creative-briefs
          path: research-*.creative.json
          retention-days: 14
      - name: Save mobile viral discovery report
        if: always() && hashFiles('data/viral-discovery-report.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: viral-discovery-report
          path: data/viral-discovery-report.html
          retention-days: 30
      - name: Save discovery results
        if: always() && hashFiles('data/discovery.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: discovery-results
          path: data/discovery.json
          retention-days: 14
      - name: Save autonomous daily editorial plan
        if: always() && hashFiles('data/strategy.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: daily-editorial-plan
          path: data/strategy.json
          retention-days: 14
      - name: Save channel niche research
        if: always() && hashFiles('data/niche-research.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: channel-niche-research
          path: data/niche-research.json
          retention-days: 30
      - name: Save YouTube analytics snapshot
        if: always() && hashFiles('data/youtube-analytics.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: youtube-analytics
          path: data/youtube-analytics.json
          retention-days: 30
      - name: Save YouTube comment inbox and reply drafts
        if: always() && hashFiles('data/youtube-comment-inbox.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: youtube-comment-inbox
          path: data/youtube-comment-inbox.json
          retention-days: 14
      - name: Save workflow readiness report
        if: always() && hashFiles('data/workflow-readiness.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: workflow-readiness
          path: data/workflow-readiness.json
          retention-days: 30
      - name: Save research dossiers
        if: always() && hashFiles('research-*.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: research-dossiers
          path: research-*.json
          retention-days: 14


  repurpose:
    if: github.event_name == 'workflow_dispatch' && inputs.repurpose_source_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python for Faster-Whisper
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Cache Faster-Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: faster-whisper-base-${{ runner.os }}-v1
      - name: Install transcription dependency
        run: python -m pip install --disable-pip-version-check -r requirements/repurposing.txt
      - name: Download rights-cleared source video
        env:
          REPURPOSE_SOURCE_URL: ${{ inputs.repurpose_source_url }}
          REPURPOSE_SOURCE_PATH: work/source-media.bin
          MEDIA_SOURCE_ALLOWED_HOSTS: ${{ vars.MEDIA_SOURCE_ALLOWED_HOSTS || 'dropbox.com,dropboxusercontent.com,drive.google.com,drive.usercontent.google.com,storage.googleapis.com' }}
          MEDIA_MAX_UPLOAD_MB: ${{ vars.MEDIA_MAX_UPLOAD_MB || '2048' }}
        run: node scripts/download-authorized-source.js
      - name: Validate rights declaration and prepare re-edit job
        env:
          REPURPOSE_SOURCE_URL: ${{ inputs.repurpose_source_url }}
          REPURPOSE_RIGHTS_STATUS: ${{ inputs.repurpose_rights_status }}
          REPURPOSE_RIGHTS_EVIDENCE_URL: ${{ inputs.repurpose_rights_evidence_url }}
          REPURPOSE_PLATFORM: ${{ inputs.repurpose_platform }}
          REPURPOSE_TARGET_SECONDS: ${{ inputs.repurpose_target_seconds }}
          REPURPOSE_TITLE: ${{ inputs.repurpose_title }}
          REPURPOSE_CREATOR: ${{ inputs.repurpose_creator }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const rightsStatus = process.env.REPURPOSE_RIGHTS_STATUS || 'not_authorized';
          const approved = new Set(['owned_by_user', 'permission_granted', 'licensed', 'public_domain']);
          if (!approved.has(rightsStatus)) throw new Error('Source is not authorised for reuse; choose an accurate rights declaration.');
          const evidence = process.env.REPURPOSE_RIGHTS_EVIDENCE_URL || '';
          if (rightsStatus !== 'owned_by_user') {
            let url;
            try { url = new URL(evidence); } catch { throw new Error('Rights evidence URL is required for permission, licensed, or public-domain footage.'); }
            if (url.protocol !== 'https:') throw new Error('Rights evidence URL must use HTTPS.');
          }
          const platform = process.env.REPURPOSE_PLATFORM;
          if (!['youtube_shorts', 'instagram_reels', 'tiktok'].includes(platform)) throw new Error('Unsupported target platform.');
          const input = {
            sourceLocalPath: 'work/source-media.bin',
            outputPath: 'output/repurposed/short.mp4',
            source: {
              sourceUrl: process.env.REPURPOSE_SOURCE_URL,
              title: process.env.REPURPOSE_TITLE || 'Authorized source video',
              creator: process.env.REPURPOSE_CREATOR || null,
              rightsStatus,
              rightsEvidenceUrl: evidence || undefined,
              allowedPlatforms: [platform]
            },
            targetDurationSeconds: Number(process.env.REPURPOSE_TARGET_SECONDS || 45),
            platform,
            whisperModel: 'base'
          };
          writeFileSync('repurpose-input.json', JSON.stringify(input, null, 2), { mode: 0o600 });
          NODE
      - name: Transcribe, analyse, select moments and render
        run: |
          npm run repurpose -- repurpose-input.json output/repurposed/result.json
          ffprobe -v error -show_entries stream=codec_name,width,height -show_entries format=duration -of json output/repurposed/short.mp4
      - name: Save finished repurposed video and editorial evidence
        if: always() && hashFiles('output/repurposed/short.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: repurposed-short
          path: |
            output/repurposed/short.mp4
            output/repurposed/short.thumbnail.jpg
            output/repurposed/result.json
            output/repurposed/short.mp4.transcript.json
          retention-days: 14

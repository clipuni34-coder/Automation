name: Discovery scan

on:
  push:
    branches: [autonomous-viral-discovery]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discovery-scan
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Restore previous discovery observations
        uses: actions/cache@v4
        with:
          path: data/discovery.json
          key: discovery-history-${{ github.run_id }}
          restore-keys: |
            discovery-history-
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run global discovery
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          DISCOVERY_REGIONS: ${{ vars.DISCOVERY_REGIONS || 'US,GB,CA,AU,IN,NG,ZA,BR,MX,DE,JP,KR' }}
          DISCOVERY_CATEGORIES: ${{ vars.DISCOVERY_CATEGORIES || '1,2,10,15,17,19,20,22,23,24,25,26,27,28,29' }}
          DISCOVERY_CONCURRENCY: '5'
          DISCOVERY_STORE_PATH: data/discovery.json
        run: |
          if [ -z "$YOUTUBE_DATA_API_KEY" ]; then
            echo "::error::YOUTUBE_DATA_API_KEY is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          npm run discover
      - name: Research the three strongest qualified candidates
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          DISCOVERY_STORE_PATH: data/discovery.json
        run: |
          if [ -z "$TAVILY_API_KEY" ]; then
            echo "::warning::TAVILY_API_KEY is missing; skipping research."
            exit 0
          fi

          if [ ! -s "$DISCOVERY_STORE_PATH" ]; then
            echo "::warning::Discovery store is missing; skipping research."
            exit 0
          fi

          count=0
          while IFS= read -r topic; do
            [ -z "$topic" ] && continue
            echo "Researching qualified candidate $((count + 1)) of up to 3"
            npm run research -- "$topic"
            count=$((count + 1))
          done < <(jq -r '[.candidates[] | select(.decision == "needs_research" and (.score // 0) >= 35) | .title] | unique | .[:3][]' "$DISCOVERY_STORE_PATH")

          echo "Research dossiers created: $count"
      - name: Save discovery results
        if: always() && hashFiles('data/discovery.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: discovery-results
          path: data/discovery.json
          retention-days: 14
      - name: Save research dossiers
        if: always() && hashFiles('research-*.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: research-dossiers
          path: research-*.json
          retention-days: 14

name: Tests

on:
  push:
    branches: [main, autonomous-viral-discovery, editorial-evidence-hold]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and verify FFmpeg for render integration tests
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - run: npm test

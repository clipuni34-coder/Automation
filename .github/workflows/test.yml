name: Tests

on:
  push:
    branches: [main, autonomous-viral-discovery, editorial-evidence-hold]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify runner FFmpeg for render integration tests
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
          ffprobe -version
      - run: npm test
